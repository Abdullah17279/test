<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تجربة GitHub HR</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:40px;color:#17202a}.card{max-width:700px;margin:auto;background:white;padding:30px;border-radius:18px;box-shadow:0 8px 30px #0001}h1{margin-top:0}.stats{display:flex;gap:15px}.stat{flex:1;background:#eef3ff;padding:20px;border-radius:12px;text-align:center}.num{font-size:30px;font-weight:bold}button{background:#111827;color:white;border:0;padding:12px 20px;border-radius:10px;cursor:pointer}#msg{margin-top:20px;font-weight:bold}</style>
</head>
<body>
<div class="card">
<h1>🧑‍💼 لوحة HR — تجربة GitHub</h1>
<p>هذه أول صفحة تجريبية محفوظة مباشرة داخل مستودع GitHub.</p>
<div class="stats">
<div class="stat">الموظفون<div class="num">120</div></div>
<div class="stat">الفروع<div class="num">6</div></div>
<div class="stat">إقامات قريبة<div class="num">8</div></div>
</div>
<br>
<button onclick="showMessage()">جرّب الزر</button>
<div id="msg"></div>
</div>
<script>function showMessage(){document.getElementById('msg').textContent='ممتاز! الصفحة تعمل ويمكننا تطويرها إلى نظام HR كامل.'}</script>
</body>
</html>
